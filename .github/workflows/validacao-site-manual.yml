name: Validacao Site Manual
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-e-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
